services:
  postgres:
    container_name: postgres
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${EXPOSE_POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    networks:
      - backend

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:9.7
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "${EXPOSE_PGADMIN_PORT}:80"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    networks:
      - backend

  goose:
    container_name: goose
    build:
      dockerfile: goose.dockerfile
    environment:
      GOOSE_DRIVER: ${GOOSE_DRIVER}
      GOOSE_DBSTRING: ${GOOSE_DBSTRING}
      GOOSE_TABLE: goose_migrations
      GOOSE_MIGRATION_DIR: /migrations
    volumes:
      - ../../internal/app/infrastructure/database/postgres/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 100M
    networks:
      - backend

  eis:
    container_name: eis
    build:
      dockerfile: eis.dockerfile
    environment:
      EIS_HOST: ${EIS_HOST}
    ports:
      - "${EXPOSE_EIS_PORT}:8080"
    volumes:
      - ../..:/app
    depends_on:
      goose:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    networks:
      - backend

volumes:
  postgres-data:
  pgadmin-data:

networks:
  backend:
    driver: bridge
